name: Bug report
description: The ledger missed an item, kept a wrong one, or drew nothing when it should have
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        One question decides most reports here, and it is easy to answer
        before you write anything: does the **Hand-off heading** option match
        the line in your instructions, character for character? The mod keeps
        only what follows that exact line. If the two disagree, nothing is
        kept, and that is the option, not a bug.

  - type: input
    id: version
    attributes:
      label: handoff-ledger version
      description: "`claude plugin list`, the line for `handoff-ledger@handoff-ledger`. Not the version on `main`."
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: cli
    attributes:
      label: Claude Code version
      description: "`claude --version`. Mods need a build with function-hook plugins, so \"no button, no error\" can be a version answer rather than a bug."
      placeholder: "2.1.311"
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where were you running Claude Code?
      options:
        - Desktop app (Code tab)
        - Terminal CLI
        - VS Code / JetBrains extension
        - More than one, and it differs between them
    validations:
      required: true

  - type: textarea
    id: block
    attributes:
      label: The hand-off block, exactly as the reply wrote it
      description: From the heading line to the end of the reply, as raw text. Most parsing reports are settled by this alone. Remove anything private first.
      render: markdown
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
      description: The items the pane listed, next to the items you expected from the block above.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to make it happen again
      description: If you cannot reproduce it, say so. An intermittent report with real timestamps beats a confident guess.
      placeholder: |
        1. Start a new session in a repo
        2. Get a reply that ends with the hand-off block above
        3. Open /handoffs: the second item is missing

  - type: checkboxes
    id: checked
    attributes:
      label: Before submitting
      options:
        - label: I saw this happen myself, on the version I named above.
          required: true
        - label: The heading option matches the line in my instructions, character for character.
          required: true
